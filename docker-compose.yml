version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-db:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "scripts.init_db"]

  userbot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    volumes:
      - ./sessions:/app/sessions
    command: ["python", "-m", "app.userbot"]
    # MUHIM: birinchi marta ishga tushirishda Telethon login (telefon kodi)
    # so'raydi — shu sababli birinchi marta buni interaktiv rejimda ishga
    # tushirish kerak (README'dagi "Birinchi marta ishga tushirish" bo'limiga qarang).
    stdin_open: true
    tty: true

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      init-db:
        condition: service_completed_successfully
    command: ["python", "-m", "app.bot.main"]

volumes:
  pgdata:
  redisdata:
